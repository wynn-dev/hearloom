name: Swift

on:
  pull_request:
    paths:
      - apps/mobile/modules/omi-capture/**
      - sidecars/diarizer/**
      - packages/shared/src/ingest*
      - .github/workflows/swift.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/modules/omi-capture/**
      - sidecars/diarizer/**
      - packages/shared/src/ingest*
      - .github/workflows/swift.yml
  workflow_dispatch:

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  omi-capture:
    name: omi-capture tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # verify-batch.ts decodes with packages/shared, which needs its dependencies.
      - run: pnpm install --frozen-lockfile --filter @hearloom/shared
      - run: apps/mobile/modules/omi-capture/tests/run-tests.sh

  diarizer:
    name: Diarizer sidecar build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: sidecars/diarizer/.build
          key: diarizer-${{ runner.os }}-${{ hashFiles('sidecars/diarizer/Package.resolved') }}
      - run: swift build -c release
        working-directory: sidecars/diarizer
